<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#b82060"><title>Sabores das Divas · Gestão online</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<section id="login-screen" class="login-shell"><div class="login-card"><div class="logo">✦</div><h1>Sabores das Divas</h1><p>Acesso reservado às pessoas autorizadas.</p><form id="login-form"><label>Nome do usuário ou e-mail<input id="login-email" type="text" autocomplete="username" maxlength="200" required placeholder="Seu nome ou e-mail"></label><label>Senha<input id="login-password" type="password" autocomplete="current-password" required></label><label>Código de autenticação, se ativado<input id="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 dígitos"></label><button type="submit" class="btn full">Entrar</button></form><p class="tiny muted">Não existe cadastro público. Peça acesso ao administrador.</p></div></section>
<div id="app" class="app hidden"><aside class="side"><div class="brand"><div class="brand-logo">✦</div><div><strong>Sabores<br>das Divas</strong><small>Gestão online</small></div></div><nav id="nav" class="nav" aria-label="Menu principal"></nav><div class="side-note"><span id="user-badge"></span><span id="side-version" class="tiny">v8.0</span><button class="btn alt small" id="logout">Sair</button></div></aside><main class="main"><header class="top"><div><div class="eyebrow">Sabores das Divas</div><h2 id="page-title">Painel</h2><p id="page-desc" class="muted"></p></div><div id="page-actions" class="actions"></div></header><div id="content"></div></main></div>
<div id="modal-root"></div></body></html>
